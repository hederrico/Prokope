# Publica a demonstração no GitHub Pages (https://hederrico.github.io/Prokope/), para testar no iPhone sem o Firebase.
# Sem as variáveis do Firebase, o app roda só no modo demonstração, com os dados de exemplo guardados no aparelho.
# Enquanto o app não chega na main, a branch da etapa 9 também publica.
name: Pages

on:
  push:
    branches: [main, etapa-9-github-pages]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # o Pages não reescreve rotas: um link direto (/Prokope/progresso) cai no 404.html, que é o próprio app
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
