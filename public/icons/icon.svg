<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Prokopē: o caminho sinuoso da tela Entrar, simplificado, sobre o wash da primária.
       Embaixo, o trecho já andado; em cima, o que falta, pontilhado; o ponto é onde você está.
       Fonte dos PNGs do app (gerados pelo Playwright). Cores do tema claro: --accent-wash, --accent-mark e --accent-ink. -->
  <rect width="512" height="512" fill="#e2f3fc"/>
  <g transform="translate(256 256) scale(16) translate(-12 -12)" fill="none" stroke-linecap="round">
    <path d="M17 12 C17 7.5 7 7.5 7 3" pathLength="4" stroke="#2a98c4" stroke-width="1.8" stroke-dasharray="0.001 1"/>
    <path d="M7 21 C7 16.5 17 16.5 17 12" stroke="#0f6585" stroke-width="2.2"/>
    <circle cx="17" cy="12" r="2.6" fill="#0f6585" stroke="none"/>
  </g>
</svg>
